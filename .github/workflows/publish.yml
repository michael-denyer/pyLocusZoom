name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Verify release tag and CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # read the default-branch CI result for the exact tagged commit
    steps:
      - name: Require a protected version tag on a tested default-branch commit
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_PROTECTED == true && $GITHUB_REF_NAME =~ ^v[0-9] ]]
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEFAULT_BRANCH...$GITHUB_SHA" --jq .status)
          [[ $status == identical || $status == behind ]]
          ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push \
            --branch "$DEFAULT_BRANCH" --commit "$GITHUB_SHA" --limit 1 --json conclusion --jq '.[0].conclusion')
          [[ $ci == success ]]
          version=$(gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/pyproject.toml?ref=$GITHUB_SHA" \
            | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])')
          [[ $GITHUB_REF_NAME == "v$version" ]]

  build:
    needs: release-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Build package
        run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing and attestation signing
      attestations: write # store the build provenance attestation
      contents: read # check out the release source
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist/
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: 'dist/*'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  # The registry entry is docs/biotools.json; tests/test_docs_contract.py
  # keeps its version equal to the package's.
  biotools:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Update the bio.tools entry
        env:
          BIOTOOLS_TOKEN: ${{ secrets.BIOTOOLS_TOKEN }}
        run: python3 scripts/update_biotools.py
