name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Run ruff check
        run: uvx ruff@0.15.2 check src tests

      - name: Run ruff format check
        run: uvx ruff@0.15.2 format --check src tests

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.22.0

      - name: Run markdownlint
        run: markdownlint-cli2 "**/*.md"

      - name: Validate mermaid diagrams (maid)
        run: |
          # shellcheck disable=SC2046
          bash scripts/check-mermaid-maid.sh $(git ls-files '*.md')

      - name: Validate mermaid diagrams (renderer parity)
        run: |
          # shellcheck disable=SC2046
          bash scripts/check-mermaid-render.sh $(git ls-files '*.md')

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3.1.1
        with:
          config_file: .yamllint.yaml

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: --config lychee.toml --no-progress "**/*.md"
          fail: true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra all

      - name: Run tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Download canine recombination maps
        run: >-
          uv run --frozen python -c
          "from pylocuszoom import download_canine_recombination_maps as d; print(d())"

      # The generator fails on any UserWarning, so a skipped overlay fails the job.
      - name: Generate example exports
        run: |
          out="$RUNNER_TEMP/example-exports"
          mkdir -p "$out/examples/matplotlib" "$out/examples/plotly" "$out/examples/bokeh"
          cd "$out"
          uv run --frozen --project "$GITHUB_WORKSPACE" \
            python "$GITHUB_WORKSPACE/examples/generate_example_plots.py"

      - name: Execute notebook
        run: uv run --frozen python scripts/execute_notebook.py examples/getting_started.ipynb

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
