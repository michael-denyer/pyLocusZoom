name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Run ruff check
        run: uvx ruff@0.15.2 check src tests

      - name: Run ruff format check
        run: uvx ruff@0.15.2 format --check src tests

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "24"

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.22.0

      - name: Run markdownlint
        run: markdownlint-cli2 "**/*.md"

      - name: Validate mermaid diagrams (maid)
        run: |
          # shellcheck disable=SC2046
          bash scripts/check-mermaid-maid.sh $(git ls-files '*.md')

      - name: Validate mermaid diagrams (renderer parity)
        run: |
          # shellcheck disable=SC2046
          bash scripts/check-mermaid-render.sh $(git ls-files '*.md')

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3.1.1
        with:
          config_file: .yamllint.yaml

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: --config lychee.toml --no-progress "**/*.md"
          fail: true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra all

      - name: Run tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run pytest

  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Download canine recombination maps
        run: >-
          uv run --frozen python -c
          "from pylocuszoom import download_canine_recombination_maps as d; print(d())"

      # The generator fails on any UserWarning, so a skipped overlay fails the job.
      - name: Generate example exports
        run: |
          out="$RUNNER_TEMP/example-exports"
          mkdir -p "$out/examples/matplotlib" "$out/examples/plotly" "$out/examples/bokeh"
          cd "$out"
          uv run --frozen --project "$GITHUB_WORKSPACE" \
            python "$GITHUB_WORKSPACE/examples/generate_example_plots.py"

      - name: Execute notebook
        run: uv run --frozen python scripts/execute_notebook.py examples/getting_started.ipynb

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ELAN_VERSION: v4.2.4
      ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The matrix runner and the Lean checker live in the plugin, not in this repo.
      - name: Check out the formal-verify helpers
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: michael-denyer/agent-formal-verify
          ref: 3893a0cf40192b8e08bb15625b796ca33e86e08d  # 0.1.11
          path: .formal-verify

      - name: Install TLC
        run: bash .formal-verify/skills/formal-verify/scripts/setup.sh tla

      - name: Check the TLA+ models
        run: |
          for matrix in specs/tla/*.matrix; do
            bash .formal-verify/skills/formal-verify/scripts/tlc-matrix.sh "$PWD/$matrix"
          done

      - name: Install elan
        run: |
          curl --fail --location --output "$RUNNER_TEMP/elan.tar.gz" \
            "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ELAN_SHA256  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/elan.tar.gz" --directory "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Check the Lean models
        run: |
          bash .formal-verify/skills/formal-verify/scripts/setup.sh lean "$PWD/specs/lean"
          bash .formal-verify/skills/formal-verify/scripts/lean-check.sh "$PWD/specs/lean"
