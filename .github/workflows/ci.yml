name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Set up Python
        run: uv python install 3.11

      - name: Run ruff check
        run: uvx ruff@0.15.2 check src tests

      - name: Run ruff format check
        run: uvx ruff@0.15.2 format --check src tests

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: "24"

      - name: Install markdownlint-cli2
        run: npm install -g markdownlint-cli2@0.22.0

      - name: Run markdownlint
        run: markdownlint-cli2 "**/*.md"

      - name: Validate mermaid diagrams (maid)
        run: |
          set -e
          fail=0
          for f in $(git ls-files '*.md'); do
            output=$(npx -y @probelabs/maid@0.0.29 "$f" 2>&1 || true)
            real_errors=$(echo "$output" | grep -v "FL-STYLE-TARGET-UNKNOWN" | grep -cE '\berror\b' || true)
            if [ "$real_errors" -gt 0 ]; then
              echo "$f:"; echo "$output"; fail=1
            fi
          done
          exit $fail

      - name: Validate mermaid diagrams (renderer parity)
        run: |
          fail=0
          for f in $(git ls-files '*.md'); do
            if ! npx -y @mermaid-js/mermaid-cli@11.4.2 -i "$f" -o /tmp/mmdc_check.svg; then
              echo "mmdc failed on $f"
              fail=1
            fi
          done
          exit $fail

      - name: Lint YAML
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3.1.1
        with:
          config_file: .yamllint.yaml

      - name: Check links
        uses: lycheeverse/lychee-action@885c65f3dc543b57c898c8099f4e08c8afd178a2  # v2.6.1
        with:
          args: --config lychee.toml --no-progress "**/*.md"
          fail: true

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev --extra all

      - name: Run tests
        # Verbose shows pytest-randomly seed for reproduction
        # To reproduce: pytest --randomly-seed=<seed>
        # Skip integration tests that require external APIs (Ensembl)
        run: uv run pytest -v -m "not integration"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
